# Cloudflare Workers (static assets) deploy for this zfb example.
#
#   build  — always runs (push + PR + manual dispatch): install, typecheck
#            (`zfb check`), build
#            (`zfb build`). This is the L3 build-output gate; it needs no
#            Cloudflare credentials, so a fresh clone/fork is green immediately.
#   deploy — pushes to `main` and manual dispatches: runs `wrangler deploy`,
#            then smoke-tests the live custom domain
#            (https://zfb-example-json-api.takazudomodular.com).
#            SELF-SKIPS when
#              * secrets.CLOUDFLARE_API_TOKEN is unset, or
#              * wrangler.toml still holds a REPLACE_WITH_* placeholder id.
#            So the repo never shows a red deploy before Cloudflare is wired up.
#            The smoke step CAN self-skip while a domain is still being wired
#            up (DNS/TLS not ready), but this domain is already live, so the
#            step sets SMOKE_REQUIRE_LIVE=1 and treats every such state as a
#            failure — an outage must not read as "not ready yet".
#
# Enable deploys by adding, in repo Settings -> Secrets and variables -> Actions:
#   CLOUDFLARE_API_TOKEN   token with Account · Workers Scripts: Edit,
#                          Account Settings: Read, and Zone · Workers Routes:
#                          Edit on the takazudomodular.com zone (that last one
#                          is what lets wrangler create the custom-domain route
#                          declared in wrangler.toml). This example declares
#                          only the ASSETS binding — no KV, AI, or D1 — so no
#                          further permissions are needed.
#   CLOUDFLARE_ACCOUNT_ID  target Cloudflare account id
name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  # Only PR runs cancel in-progress runs. A mid-flight `wrangler deploy` (or the
  # post-deploy smoke step) must never be interrupted — that can leave the Worker
  # half-updated — so push runs never cancel a run that is already going; the next
  # push waits instead. Note GitHub still supersedes runs that are merely QUEUED,
  # so with 3+ rapid pushes the intermediate ones are dropped and only the newest
  # pending run follows the in-flight one. That is intended: the running deploy
  # finishes, and the newest commit is what deploys next.
  #
  # Allow-list (== 'pull_request'), not a deny-list (!= 'push'), on purpose: if a
  # `workflow_dispatch` trigger is ever added, a manual run on main shares this
  # group (same github.ref), and the deny-list form would evaluate true and let it
  # cancel a live deploy — reintroducing the exact bug this guards against.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build (typecheck + zfb build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  deploy:
    name: Deploy to Cloudflare Workers
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Preflight — is Cloudflare configured?
        id: preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set — skipping deploy. Add it and CLOUDFLARE_ACCOUNT_ID in repo Settings to enable deploys."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif grep -q "REPLACE_WITH" wrangler.toml; then
            echo "::notice::wrangler.toml still has a REPLACE_WITH_* placeholder — provision the resource, commit the real id, then deploy will run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        if: steps.preflight.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
      # Confirms the deploy actually landed on the custom domain — including
      # the SSR JSON routes, which only answer correctly if the Worker (not
      # just the asset layer) is serving that host. The domain is attached and
      # serving, so SMOKE_REQUIRE_LIVE turns the propagation-window leniency
      # off: an unreachable host or a 5xx from the edge fails this step.
      - name: Smoke test the custom domain
        if: steps.preflight.outputs.ready == 'true'
        env:
          SMOKE_REQUIRE_LIVE: "1"
        run: pnpm smoke
